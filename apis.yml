aid: aqueduct
name: Aqueduct
description: >-
  Aqueduct is a fintech billing platform that equips B2B businesses with billing,
  invoicing, quoting, and accounting for usage-based and metered business models.
  Developers configure how they collect money as a PriceModel (composed of price
  functions such as per-unit meters), send billable usage events, and let Aqueduct
  create invoices and subscriptions, send invoices by email, issue refunds, and
  auto-provision access via signed webhooks. The REST API lives at
  api.tryaqueduct.com/v1 with API-key authentication and a documented
  Idempotency-Key contract. Founded 2020 in Bellevue, WA and backed by Bain Capital
  Ventures and Conversion Capital, Aqueduct was acquired by Stripe in August 2024;
  its ReadMe developer portal at docs.tryaqueduct.com remains live.
